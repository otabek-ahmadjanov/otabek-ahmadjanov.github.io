<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<header th:replace="~{layout :: header('blog')}"></header>

<main class="container">
    <th:block th:if="${!articles.isEmpty()}">
        <th:block th:replace="~{fragments :: postList(${articles})}"></th:block>
    </th:block>
    <p class="empty-state" th:if="${articles.isEmpty()}" th:text="#{home.empty}">No articles yet.</p>

    <nav class="pagination" th:if="${pagination.multiPage()}" aria-label="Pagination">
        <a th:if="${pagination.prevUrl}" class="pagination-link"
           th:href="${pagination.prevUrl}" th:text="#{pagination.prev}">&larr; prev</a>
        <span th:unless="${pagination.prevUrl}" class="pagination-link disabled"
              th:text="#{pagination.prev}">&larr; prev</span>

        <span class="pagination-info"
              th:text="#{pagination.pageOf(${pagination.page}, ${pagination.totalPages})}">Page 1 of 3</span>

        <a th:if="${pagination.nextUrl}" class="pagination-link"
           th:href="${pagination.nextUrl}" th:text="#{pagination.next}">next &rarr;</a>
        <span th:unless="${pagination.nextUrl}" class="pagination-link disabled"
              th:text="#{pagination.next}">next &rarr;</span>
    </nav>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
